name: R and Typst checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  RAYON_NUM_THREADS: 2
  OMP_THREAD_LIMIT: 2
  R_RD4PDF: times,hyper

jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }} / Typst ${{ matrix.typst }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        typst: ["0.15.0", "latest"]
        r: [release]
        include:
          - os: ubuntu-latest
            r: devel
            typst: latest
          - os: ubuntu-latest
            r: oldrel-1
            typst: latest
          - os: ubuntu-latest
            r: release
            typst: none
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytex
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install manual typesetting packages
        shell: Rscript {0}
        run: |
          status <- tinytex::tlmgr_install(c(
            "memoir", "xpatch", "lm", "microtype", "pgf", "listings", "upquote", "framed",
            "courier", "times", "helvetic", "makeindex"))
          stopifnot(status == 0L)
      - name: Install macOS Cairo runtime
        if: runner.os == 'macOS'
        run: brew install --cask xquartz
      - name: Verify native Cairo PNG
        shell: Rscript {0}
        run: |
          file <- tempfile(fileext = ".png")
          grDevices::png(file, width = 32, height = 32, type = "cairo")
          grid::grid.newpage()
          grid::grid.rect()
          grDevices::dev.off()
          stopifnot(file.exists(file))
          unlink(file)
      - uses: typst-community/setup-typst@v5
        if: matrix.typst != 'none'
        with:
          typst-version: ${{ matrix.typst }}
          cache-dependency-path: dev/typst-dependencies.typ
      - name: Verify Typst packages
        if: matrix.typst != 'none'
        shell: bash
        run: typst compile dev/typst-dependencies.typ "$RUNNER_TEMP/cetz-dependencies.svg" --jobs 2
      - name: Verify Typst is absent
        if: matrix.typst == 'none'
        shell: Rscript {0}
        run: stopifnot(!nzchar(Sys.which("typst")))
      - name: Check package
        shell: Rscript {0}
        env:
          NOT_CRAN: "false"
        run: |
          rcmdcheck::rcmdcheck(args = "--as-cran", build_args = "--compact-vignettes=both",
                              error_on = "warning", check_dir = "check")
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r-check-${{ matrix.os }}-r-${{ matrix.r }}-typst-${{ matrix.typst }}
          path: check
          if-no-files-found: ignore
