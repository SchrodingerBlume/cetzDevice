name: Package and release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/check.yaml

  publish:
    name: Publish checked source package
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Read release metadata
        id: release
        run: Rscript dev/prepare-release.R --metadata
      - name: Verify the release tag target
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse --verify "$RELEASE_TAG^{commit}" > /dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: r-check-ubuntu-latest-r-release-typst-0.15.0
          path: output/release-check
      - name: Prepare release assets
        env:
          RELEASE_DIR: ${{ steps.release.outputs.directory }}
        run: Rscript dev/prepare-release.R output/release-check "$RELEASE_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.directory }}
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_DIR: ${{ steps.release.outputs.directory }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR/${PACKAGE}_${VERSION}.tar.gz#R source package" \
            "$RELEASE_DIR/${PACKAGE}-manual-${VERSION}.pdf#User manual" \
            "$RELEASE_DIR/${PACKAGE}-reference-${VERSION}.pdf#API reference" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/BUILD-INFO.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$PACKAGE $VERSION" \
            --notes-file "$RELEASE_DIR/release-notes.md" \
            --latest
